services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
    command: uvicorn src.app.api:app --host 0.0.0.0 --port 8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
    command: python -m src.app.runner
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
    depends_on:
      - redis
      - api
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file:
      - .env
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run", "--token", "${CLOUDFLARED_TUNNEL_TOKEN}"]
    volumes:
      - ./infra/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - ui
    restart: unless-stopped
  # Optional: Cloudflare tunnel (requires existing tunnel token)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
  #   restart: unless-stopped
