services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["uvicorn", "src.app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ..:/app
    ports:
      - "8000:8000"

  ui:
    image: node:18
    working_dir: /ui
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
    volumes:
      - ../ui:/ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api

volumes:
